<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Escool">
<title>Open Escool</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone/icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone/icona-192.png">
<meta name="theme-color" content="#0b0c0d">
<link rel="stylesheet" href="/stile.css">
<script>
  // tema antes de pintar, para que no parpadee
  (function () {
    var t = localStorage.getItem("tema") || "scuro";
    var scuro = t === "scuro" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.tema = scuro ? "scuro" : "chiaro";
  })();
</script>
</head>
<body>
<header class="barra">
  <button class="icona" id="b-tappe" title="Etapas" aria-label="Etapas">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="marchio" href="/" data-link>
    <span class="logo" id="logo">A</span>
    <span><b id="nome">Open Escool</b><small id="sottotitolo"></small></span>
  </a>
  <div class="briciole" id="briciole"></div>
  <a class="crediti" href="https://ismagit.com" target="_blank" rel="noopener" title="Ismagit · ismagit.com">
    <span id="crediti-testo">un progetto di</span>
    <img class="su-scuro" src="/marca/ismagit-bianco.png" alt="Ismagit" width="62" height="18">
    <img class="su-chiaro" src="/marca/ismagit-nero.png" alt="Ismagit" width="62" height="18">
  </a>
  <div class="azioni-barra">
    <button class="icona" id="b-tema" title="Tema"></button>
    <button class="icona" id="b-impostazioni" title="Ajustes">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>
<main id="vista"></main>
<dialog id="finestra"><div id="finestra-corpo"></div></dialog>
<div id="avviso" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
